[workspace]

[package]
name = "plasmidbin-validate"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-or-later"
description = "Typed validation for plasmidBin metadata: manifest, checksums, ports, sources"

[[bin]]
name = "plasmidbin-validate"
path = "src/main.rs"

[dependencies]
toml = "0.8"
serde = { version = "1", features = ["derive"] }
