# wetspring — Metagenomics primal (from wetSpring)
# SPDX-License-Identifier: AGPL-3.0-or-later

[primal]
name = "wetspring"
version = "0.8.0"
domain = "metagenomics"
description = "Life science + PFAS analytical chemistry — IPC science primal via barraCuda"
license = "AGPL-3.0-or-later"

[provenance]
built_from = "springs/wetSpring"
built_at = "2026-04-20T00:00:00Z"
barracuda_version = "0.3.12"
primalspring_version = "0.9.16"
tests = 1702
validation_binaries = 342
composition_model = "nucleated"
composition_validation = "Exp400-403 + wetspring_guidestone (guideStone Level 3, bare certified 16/16, v0.9.16 manifest, BLAKE3 checksums)"
consumed_barracuda_ipc = 48
guidestone_binary = "wetspring_guidestone"
guidestone_readiness = 3

[compatibility]
min_ipc_version = "2.0"
proto_nucleate = "wetspring_lifescience_proto_nucleate"
capabilities = [
    "identity.get",
    "science.diversity",
    "science.qs_model",
    "science.anderson",
    "science.kinetics",
    "science.alignment",
    "science.taxonomy",
    "science.phylogenetics",
    "science.nmf",
    "science.ncbi_fetch",
    "science.full_pipeline",
    "science.timeseries",
    "science.gonzales.dose_response",
    "science.gonzales.pk_decay",
    "science.gonzales.tissue_lattice",
    "science.anderson.biome_atlas",
    "science.anderson.hormesis",
    "science.anderson.disorder_sweep",
    "science.anderson.cross_species",
    "science.timeseries_diversity",
    "data.fetch.register_table",
    "provenance.begin",
    "provenance.record",
    "provenance.complete",
    "brain.observe",
    "brain.attention",
    "brain.urgency",
    "ai.ecology_interpret",
    "composition.science_health",
    "vault.store",
    "vault.retrieve",
    "vault.consent.verify",
    "data.fetch.chembl",
    "data.fetch.pubchem",
    "health.check",
    "health.liveness",
    "health.readiness",
    "capability.list",
    "metrics.snapshot",
]

# ── ecoBin: per-architecture builds ─────────────────────────────────

[builds.x86_64-linux]
binary = "wetspring"
target = "x86_64-unknown-linux-musl"
pie_verified = true
static_linked = true
# checksum_sha256 = ""  # populated on harvest

[builds.aarch64-linux]
binary = "wetspring"
target = "aarch64-unknown-linux-musl"
pie_verified = true
static_linked = true
# checksum_sha256 = ""  # populated on harvest

# ── genomeBin: deployment intelligence ──────────────────────────────

[genomeBin]
tier = "ecoBin"
unibin_modes = ["server", "version"]
default_mode = "server"

[genomeBin.server]
tcp_port_env = "WETSPRING_PORT"
tcp_port_default = 9880

[genomeBin.service]
restart_policy = "always"
after = ["beardog", "songbird"]
wants = ["nestgate", "toadstool", "rhizocrypt", "loamspine", "sweetgrass"]

[genomeBin.composition]
fragments = ["tower_atomic", "node_atomic", "nest_atomic", "meta_tier"]
deploy_graph = "wetspring_science_nucleus.toml"
bonding = ["Covalent", "Ionic"]
