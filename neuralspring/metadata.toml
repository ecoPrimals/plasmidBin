# neuralspring — Neural science primal (from neuralSpring)
# SPDX-License-Identifier: AGPL-3.0-or-later

[primal]
name = "neuralspring"
version = "0.1.0"
domain = "science.learning"
description = "ML inference, spectral analysis, protein folding, and neural network validation — WGSL shader composition over barraCuda + coralReef + toadStool. 3-tier validation: Python→Rust→IPC composition parity."
license = "AGPL-3.0-or-later"

[provenance]
built_from = "springs/neuralSpring"
built_at = "2026-04-17T00:00:00Z"

[compatibility]
min_ipc_version = "1.0"
capabilities = [
    "science.spectral_analysis",
    "science.anderson_localization",
    "science.hessian_eigen",
    "science.agent_coordination",
    "science.ipr",
    "science.disorder_sweep",
    "science.training_trajectory",
    "science.evoformer_block",
    "science.structure_module",
    "science.folding_health",
    "science.gpu_dispatch",
    "science.cross_spring_provenance",
    "science.cross_spring_benchmark",
    "science.precision_routing",
    "health.liveness",
    "health.readiness",
    "health.check",
    "inference.complete",
    "inference.embed",
    "inference.models",
    "provenance.begin",
    "provenance.record",
    "provenance.complete",
    "provenance.status",
    "primal.forward",
    "primal.discover",
    "capability.list",
    "identity.get",
    "mcp.tools.list",
    "compute.offload",
]

# ── ecoBin: per-architecture builds ─────────────────────────────────

[builds.x86_64-linux]
binary = "neuralspring"
target = "x86_64-unknown-linux-musl"
pie_verified = true
static_linked = true
# checksum_sha256 = ""  # populated on harvest

[builds.aarch64-linux]
binary = "neuralspring"
target = "aarch64-unknown-linux-musl"
pie_verified = true
static_linked = true
# checksum_sha256 = ""  # populated on harvest

# ── genomeBin: deployment intelligence ──────────────────────────────

[genomeBin]
tier = "ecoBin"
unibin_modes = ["serve", "health", "capabilities"]
default_mode = "serve"

[genomeBin.server]
tcp_port_env = "NEURALSPRING_PORT"
tcp_port_default = 9870

[genomeBin.service]
restart_policy = "always"
after = ["beardog", "songbird"]
wants = []
