# primal.eco inner membrane DNS — LAN + WireGuard mesh resolution
# Deployed by sporeGate topology team, Wave 157j
# Resolves *.primal.eco to inner membrane IPs.
# LAN gates use 192.168.4.x/22 (validated Wave 157j — southGate LAN gossip).
# WAN/VPS gates use WireGuard 10.13.37.x overlay.
# primal.eco public A records REMOVED from Knot DNS — invisible externally.

# Hub (VPS — WireGuard only)
address=/golgi.primal.eco/10.13.37.1

# LAN gates — prefer LAN IPs for same-subnet mesh (no WG needed)
address=/sporegate.primal.eco/192.168.4.3
address=/eastgate.primal.eco/192.168.4.244
address=/irongate.primal.eco/192.168.4.237
address=/southgate.primal.eco/192.168.4.149
address=/strandgate.primal.eco/192.168.4.169
address=/bluegate.primal.eco/192.168.4.210

# LAN gates without confirmed LAN IP — WireGuard fallback
address=/biomegate.primal.eco/10.13.37.3
address=/northgate.primal.eco/192.168.4.147

# WAN/remote gates — WireGuard overlay
address=/flockgate.primal.eco/10.13.37.6
address=/graftgate.primal.eco/10.13.37.13
address=/graphenegate.primal.eco/10.13.37.11

# WG-overlay aliases (wg.<gate>.primal.eco) for explicit WG routing
address=/wg.sporegate.primal.eco/10.13.37.2
address=/wg.eastgate.primal.eco/10.13.37.5
address=/wg.irongate.primal.eco/10.13.37.7
address=/wg.southgate.primal.eco/10.13.37.9
address=/wg.strandgate.primal.eco/10.13.37.10
address=/wg.bluegate.primal.eco/10.13.37.12
address=/wg.northgate.primal.eco/10.13.37.8

# westGate (NAS — no WG, LAN IP TBD)
# address=/westgate.primal.eco/<lan_ip>

# Bare primal.eco resolves to sporeGate (mesh authority / foreman)
address=/primal.eco/192.168.4.3

# Inner membrane domain — don't forward to upstream
local=/primal.eco/
