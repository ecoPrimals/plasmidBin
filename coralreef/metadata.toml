# coralreef — Shader compiler & GPU pipeline primal
# SPDX-License-Identifier: AGPL-3.0-or-later

[primal]
name = "coralreef"
version = "0.1.0"
domain = "shaders"
description = "Shader compiler, GPU pipeline management, and visual effects"
license = "AGPL-3.0-or-later"

[provenance]
built_from = "primals/coralReef"
built_at = "2026-03-31T11:15:00Z"
build_ref = "d908d84 (Iter 70e: CoralIR Cranelift JIT backend)"

[compatibility]
min_ipc_version = "1.0"
capabilities = [
    "shader.compile",
    "shader.compile.wgsl",
    "shader.compile.spirv",
    "shader.compile.wgsl.multi",
    "shader.compile.capabilities",
    "shader.compile.status",
    "shader.compile.cpu",
    "shader.execute.cpu",
    "shader.execute.jit",
    "shader.validate",
    "shader.validate.dual-path",
    "health.check",
    "health.liveness",
    "health.readiness",
    "identity.get",
    "capabilities.list",
]

# ── ecoBin: per-architecture builds ─────────────────────────────────
# x86_64 only for now (no aarch64 builds yet).

[builds.x86_64-linux]
binary = "coralreef"
checksum_sha256 = "5a155d540cdc9145733d8b1fd8859f039e22045d95c24e54461ee5308dd28069"
target = "x86_64-unknown-linux-gnu"
pie_verified = true

[builds.aarch64-linux]
binary = "coralreef"
target = "aarch64-unknown-linux-musl"
pie_verified = true
static_linked = true
# checksum_sha256 = ""  # no aarch64 build yet

# ── genomeBin: deployment intelligence ──────────────────────────────

[genomeBin]
tier = "genomeBin"
unibin_modes = ["server", "compile", "doctor"]
default_mode = "server"

[genomeBin.server]
tcp_port_env = "CORALREEF_PORT"
tcp_port_default = 9730
port_flag = "--port"
socket_flag = "--socket"

[genomeBin.service]
restart_policy = "always"
after = []
wants = ["toadstool"]
