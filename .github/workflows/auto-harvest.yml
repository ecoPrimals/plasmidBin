# SPDX-License-Identifier: AGPL-3.0-or-later
#
# auto-harvest.yml — Automated primal build + harvest pipeline (genomeBin cross-arch)
#
# Triggers:
#   1. repository_dispatch from primal repos (on push to main)
#   2. workflow_dispatch for manual rebuilds (single primal or all)
#   3. Weekly schedule for full-sweep consistency
#   4. check-updates.yml dispatches for individual stale primals (daily)
#
# Private repos (bearDog, skunkBat) are cloned using the PAT via git insteadOf.
# Public binaries are published to GitHub Releases regardless of source visibility.
#
# genomeBin Tier 1 MUST targets are built in parallel via matrix strategy:
#   x86_64-unknown-linux-musl, aarch64-unknown-linux-musl, armv7-unknown-linux-musleabihf
#
# Flow: determine target -> matrix build (3 parallel) -> consolidate -> harvest
#       -> commit checksums -> upload to GitHub Release -> smoke test
#
# Runner strategy: sovereign-first. Uses self-hosted irongate runner by default.
# Set org variable USE_GITHUB_HOSTED=true to fall back to ubuntu-latest.

name: Auto Harvest

on:
  repository_dispatch:
    types: [primal-updated]

  workflow_dispatch:
    inputs:
      primal:
        description: 'Primal to rebuild (source ID from sources.toml, or "all")'
        required: true
        default: 'all'
        type: string

  schedule:
    - cron: '0 6 * * 1'   # weekly full sweep (Monday 06:00 UTC)

concurrency:
  group: auto-harvest-${{ github.event.client_payload.primal || github.event.inputs.primal || 'sweep' }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  prepare:
    runs-on: ${{ vars.USE_GITHUB_HOSTED == 'true' && 'ubuntu-latest' || fromJson('["self-hosted", "linux", "x86_64"]') }}
    outputs:
      primal: ${{ steps.target.outputs.primal }}
      commit: ${{ steps.target.outputs.commit }}
      tag: ${{ steps.version.outputs.tag }}
      notes: ${{ steps.version.outputs.notes }}
    steps:
      - name: Determine what to build
        id: target
        run: |
          if [[ "${{ github.event_name }}" == "repository_dispatch" ]]; then
            RAW="${{ github.event.client_payload.primal }}"
            PRIMAL="${RAW,,}"
            COMMIT="${{ github.event.client_payload.sha }}"
            echo "primal=$PRIMAL" >> "$GITHUB_OUTPUT"
            echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
            echo "Dispatch: build $PRIMAL (raw: $RAW, commit $COMMIT)"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            RAW="${{ github.event.inputs.primal }}"
            PRIMAL="${RAW,,}"
            echo "primal=$PRIMAL" >> "$GITHUB_OUTPUT"
            echo "commit=" >> "$GITHUB_OUTPUT"
            echo "Manual: build $PRIMAL (raw: $RAW)"
          else
            echo "primal=all" >> "$GITHUB_OUTPUT"
            echo "commit=" >> "$GITHUB_OUTPUT"
            echo "Schedule: full sweep"
          fi

      - name: Extract version info
        id: version
        run: |
          PRIMAL="${{ steps.target.outputs.primal }}"
          TAG="v$(date -u +%Y.%m.%d)"
          NOTES="Auto-harvest $(date -u +%Y-%m-%d)"
          if [[ "$PRIMAL" != "all" ]]; then
            NOTES="$NOTES — $PRIMAL"
            COMMIT="${{ steps.target.outputs.commit }}"
            if [[ -n "$COMMIT" ]]; then
              NOTES="$NOTES ($COMMIT)"
            fi
          else
            NOTES="$NOTES — full sweep (all primals, Tier 1 cross-arch)"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "notes=$NOTES" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ${{ vars.USE_GITHUB_HOSTED == 'true' && 'ubuntu-latest' || fromJson('["self-hosted", "linux", "x86_64"]') }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
          - armv7-unknown-linux-musleabihf

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (GitHub-hosted only)
        if: ${{ vars.USE_GITHUB_HOSTED == 'true' }}
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Add Rust target (self-hosted)
        if: ${{ vars.USE_GITHUB_HOSTED != 'true' }}
        run: rustup target add ${{ matrix.target }}

      - name: Install cross-compilation toolchain (GitHub-hosted only)
        if: ${{ vars.USE_GITHUB_HOSTED == 'true' }}
        run: |
          sudo apt-get update -qq
          case "${{ matrix.target }}" in
            x86_64-unknown-linux-musl)
              sudo apt-get install -y -qq musl-tools
              ;;
            aarch64-unknown-linux-musl)
              sudo apt-get install -y -qq musl-tools gcc-aarch64-linux-gnu
              ;;
            armv7-unknown-linux-musleabihf)
              sudo apt-get install -y -qq musl-tools gcc-arm-linux-gnueabihf
              ;;
          esac

      - name: Configure cross-linkers (GitHub-hosted only)
        if: ${{ vars.USE_GITHUB_HOSTED == 'true' }}
        run: |
          mkdir -p ~/.cargo
          cat >> ~/.cargo/config.toml <<'TOML'
          [target.aarch64-unknown-linux-musl]
          linker = "aarch64-linux-gnu-gcc"

          [target.armv7-unknown-linux-musleabihf]
          linker = "arm-linux-gnueabihf-gcc"
          TOML

      - name: Configure git for private repos
        env:
          HARVEST_PAT: ${{ secrets.PLASMIDBIN_HARVEST_PAT }}
        run: |
          TOKEN=$(echo -n "$HARVEST_PAT" | tr -d '[:space:]')
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Install Rust toolchain for plasmidbin CLI (GitHub-hosted only)
        if: ${{ vars.USE_GITHUB_HOSTED == 'true' }}
        uses: dtolnay/rust-toolchain@stable

      - name: Build primal(s) for ${{ matrix.target }}
        run: |
          PRIMAL="${{ needs.prepare.outputs.primal }}"
          COMMIT="${{ needs.prepare.outputs.commit }}"
          COMMIT_FLAG=""
          if [[ -n "$COMMIT" ]]; then
            COMMIT_FLAG="--commit $COMMIT"
          fi
          if [[ "$PRIMAL" == "all" ]]; then
            cargo run -p plasmidbin -- build all --target "${{ matrix.target }}"
          else
            cargo run -p plasmidbin -- build "$PRIMAL" --target "${{ matrix.target }}" $COMMIT_FLAG
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: primals-${{ matrix.target }}
          path: /tmp/primalspring-deploy/primals/${{ matrix.target }}/
          retention-days: 1
          if-no-files-found: warn

  consolidate:
    needs: [prepare, build]
    runs-on: ${{ vars.USE_GITHUB_HOSTED == 'true' && 'ubuntu-latest' || fromJson('["self-hosted", "linux", "x86_64"]') }}
    timeout-minutes: 15
    concurrency:
      group: harvest-consolidate
      cancel-in-progress: false
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PLASMIDBIN_HARVEST_PAT }}

      - name: Install Rust toolchain (GitHub-hosted only)
        if: ${{ vars.USE_GITHUB_HOSTED == 'true' }}
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo (GitHub-hosted only)
        if: ${{ vars.USE_GITHUB_HOSTED == 'true' }}
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: harvest-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: /tmp/harvest-artifacts

      - name: Harvest all architectures
        run: |
          PRIMAL="${{ needs.prepare.outputs.primal }}"
          HARVEST_FAILURES=0

          for artifact_dir in /tmp/harvest-artifacts/primals-*/; do
            [[ -d "$artifact_dir" ]] || continue
            triple=$(basename "$artifact_dir" | sed 's/^primals-//')
            echo ""
            echo "=== Harvesting $triple ==="

            count=$(find "$artifact_dir" -maxdepth 1 -type f | wc -l)
            if [[ "$count" -eq 0 ]]; then
              echo "  (no binaries for $triple — build may have failed)"
              HARVEST_FAILURES=$((HARVEST_FAILURES + 1))
              continue
            fi

            ARGS=(--arch "$triple" --source "$artifact_dir" --root .)
            if [[ "$PRIMAL" != "all" ]]; then
              ARGS+=(--primal "$PRIMAL")
              # Resolve upstream version tag for manifest.toml auto-update
              REPO=$(grep -A5 "^\[sources\.${PRIMAL}\]" sources.toml | grep '^repo' | head -1 | sed 's/.*= *"\(.*\)"/\1/')
              if [[ -n "$REPO" ]]; then
                VTAG=$(gh api "repos/${REPO}/tags?per_page=1" --jq '.[0].name // empty' 2>/dev/null || true)
                if [[ -n "$VTAG" ]]; then
                  ARGS+=(--version-tag "$VTAG")
                fi
              fi
            fi
            if ! cargo run -p plasmidbin -- harvest "${ARGS[@]}"; then
              echo "ERROR: harvest failed for $triple"
              HARVEST_FAILURES=$((HARVEST_FAILURES + 1))
            fi
          done

          if [[ "$HARVEST_FAILURES" -gt 0 ]]; then
            echo ""
            echo "FATAL: $HARVEST_FAILURES architecture(s) failed harvest — aborting to prevent stale checksums"
            exit 1
          fi

      - name: Commit updated checksums and binaries
        id: commit
        run: |
          git config user.name "plasmidBin-bot"
          git config user.email "plasmidbin-bot@ecoPrimals.dev"

          echo "=== Pre-commit diagnostics ==="
          echo "checksums.toml git status:"
          git status checksums.toml
          echo ""
          echo "checksums.toml diff (first 20 lines):"
          git diff checksums.toml | head -20 || true
          echo ""

          git add checksums.toml
          git add manifest.toml 2>/dev/null || true
          git add primals/ 2>/dev/null || true
          git add springs/ 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No changes to commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            PRIMAL="${{ needs.prepare.outputs.primal }}"
            echo ""
            echo "=== Checksum changes ==="
            git diff --cached checksums.toml | grep '^[+-]"' | head -40 || true
            echo ""
            git commit -m "harvest: $PRIMAL — $(date -u +%Y-%m-%d) — Tier 1 cross-arch"
            for attempt in 1 2 3; do
              git push && break
              echo "Push failed (attempt $attempt), rebasing..."
              git pull --rebase
            done
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Post-harvest validation
        if: ${{ steps.commit.outputs.changed == 'true' }}
        run: cargo run -p plasmidbin -- validate .

      - name: Rename assets for multi-arch release
        id: assets
        run: |
          PRIMAL="${{ needs.prepare.outputs.primal }}"
          STAGING="/tmp/release-assets"
          mkdir -p "$STAGING"

          for triple_dir in primals/*/; do
            triple=$(basename "$triple_dir")
            [[ "$triple" == "x86_64-unknown-linux-musl" || \
               "$triple" == "aarch64-unknown-linux-musl" || \
               "$triple" == "armv7-unknown-linux-musleabihf" ]] || continue

            for bin in "$triple_dir"/*; do
              [[ -f "$bin" ]] || continue
              name=$(basename "$bin")

              if [[ "$PRIMAL" != "all" && "$name" != "$PRIMAL" && "$name" != "${PRIMAL}_primal" ]]; then
                continue
              fi

              cp "$bin" "$STAGING/${name}-${triple}"
            done
          done

          # Also upload checksums.toml as a release asset
          cp checksums.toml "$STAGING/checksums.toml"

          echo "staging=$STAGING" >> "$GITHUB_OUTPUT"

          echo "--- Release assets ---"
          ls -lh "$STAGING/"

      - name: Carry forward assets from previous release
        id: carryforward
        env:
          GH_TOKEN: ${{ secrets.PLASMIDBIN_HARVEST_PAT }}
        run: |
          TAG="${{ needs.prepare.outputs.tag }}"
          PRIMAL="${{ needs.prepare.outputs.primal }}"
          STAGING="${{ steps.assets.outputs.staging }}"

          if [[ "$PRIMAL" == "all" ]]; then
            echo "Full sweep — no carry-forward needed"
            echo "carried=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PREV_TAG=$(gh release list --repo ecoPrimals/plasmidBin -L 5 \
            | awk '{print $NF}' | grep -v "^${TAG}$" | head -1 || true)
          if [[ -z "$PREV_TAG" ]]; then
            echo "No previous release found — skipping carry-forward"
            echo "carried=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Carrying forward missing assets from $PREV_TAG to $TAG"
          CARRIED=0
          PREV_ASSETS=$(gh release view "$PREV_TAG" --repo ecoPrimals/plasmidBin \
            | grep "^asset:" | awk '{print $2}' || true)
          for asset_name in $PREV_ASSETS; do
            [[ "$asset_name" == "checksums.toml" ]] && continue
            if [[ -f "$STAGING/$asset_name" ]]; then
              echo "  SKIP $asset_name (rebuilt in this run)"
              continue
            fi
            echo "  CARRY $asset_name"
            gh release download "$PREV_TAG" \
              --repo ecoPrimals/plasmidBin \
              --pattern "$asset_name" \
              --dir "$STAGING" || {
                echo "  WARN: failed to download $asset_name from $PREV_TAG"
                continue
              }
            CARRIED=$((CARRIED + 1))
          done
          echo "Carried forward $CARRIED assets from $PREV_TAG"
          echo "carried=$CARRIED" >> "$GITHUB_OUTPUT"

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.PLASMIDBIN_HARVEST_PAT }}
        run: |
          TAG="${{ needs.prepare.outputs.tag }}"
          NOTES="${{ needs.prepare.outputs.notes }}"
          STAGING="${{ steps.assets.outputs.staging }}"
          CARRIED="${{ steps.carryforward.outputs.carried }}"

          ASSETS=()
          for f in "$STAGING"/*; do
            [[ -f "$f" ]] && ASSETS+=("$f")
          done

          if [[ ${#ASSETS[@]} -eq 0 ]]; then
            echo "No assets to upload"
            exit 0
          fi

          if [[ -n "$CARRIED" && "$CARRIED" -gt 0 ]]; then
            NOTES="$NOTES (carried forward $CARRIED unchanged assets)"
          fi

          if gh release view "$TAG" --repo ecoPrimals/plasmidBin >/dev/null 2>&1; then
            echo "Uploading ${#ASSETS[@]} assets to existing release $TAG ..."
            gh release upload "$TAG" \
              --repo ecoPrimals/plasmidBin \
              --clobber \
              "${ASSETS[@]}"
          else
            echo "Creating release $TAG with ${#ASSETS[@]} assets ..."
            gh release create "$TAG" \
              --repo ecoPrimals/plasmidBin \
              --title "plasmidBin $TAG" \
              --notes "$NOTES" \
              "${ASSETS[@]}"
          fi

      - name: Summary
        run: |
          echo "### Auto Harvest Complete" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Target**: ${{ needs.prepare.outputs.primal }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Release**: ${{ needs.prepare.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Trigger**: ${{ github.event_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Architectures**: x86_64-unknown-linux-musl, aarch64-unknown-linux-musl, armv7-unknown-linux-musleabihf" >> "$GITHUB_STEP_SUMMARY"
