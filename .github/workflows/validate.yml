#
# validate.yml — plasmidBin metadata integrity checks (Rust-powered)
#
# Typed validation via `plasmidbin validate` replaces all bash grep/sed/xargs
# checks. Parses manifest.toml, checksums.toml, ports.env, sources.toml with
# serde-typed structs, cross-validates references, and checks shell syntax.

name: Validate Metadata

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: validate-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Run plasmidbin validate
        run: cargo run -p plasmidbin -- validate .

      - name: Dry-run fetch (check asset availability)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cargo run -p plasmidbin -- fetch --dry-run --all 2>&1 || echo "(no releases yet — expected for fresh repos)"
