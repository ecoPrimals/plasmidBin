# SPDX-License-Identifier: AGPL-3.0-or-later
#
# validate.yml — plasmidBin metadata integrity checks (Rust-powered)
#
# Typed validation via `plasmidbin validate` replaces all bash grep/sed/xargs
# checks. Parses manifest.toml, checksums.toml, ports.env, sources.toml with
# serde-typed structs, cross-validates references, and checks shell syntax.
#
# Runner strategy: sovereign-first. Uses self-hosted irongate runner by default.
# Set org variable USE_GITHUB_HOSTED=true to fall back to ubuntu-latest.
#
# On self-hosted: uses raw git checkout (no marketplace action dependency) and
# pre-installed Rust toolchain. Zero external archive downloads required —
# survives GitHub codeload outages that break `uses:` steps.

name: Validate Metadata

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ${{ vars.USE_GITHUB_HOSTED == 'true' && 'ubuntu-latest' || fromJson('["self-hosted", "linux", "x86_64"]') }}
    steps:
      - name: Checkout (GitHub-hosted)
        if: ${{ vars.USE_GITHUB_HOSTED == 'true' }}
        uses: actions/checkout@v4

      - name: Checkout (self-hosted, raw git)
        if: ${{ vars.USE_GITHUB_HOSTED != 'true' }}
        run: |
          REPO="https://github.com/${{ github.repository }}.git"
          REF="${{ github.ref }}"
          SHA="${{ github.sha }}"
          if [ -d ".git" ]; then
            git fetch origin "$REF" --depth=1
          else
            git init
            git remote add origin "$REPO"
            git fetch origin "$REF" --depth=1
          fi
          git checkout --force "$SHA"

      - name: Install Rust toolchain (GitHub-hosted only)
        if: ${{ vars.USE_GITHUB_HOSTED == 'true' }}
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo (GitHub-hosted only)
        if: ${{ vars.USE_GITHUB_HOSTED == 'true' }}
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: validate-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Verify toolchain
        run: |
          rustc --version
          cargo --version

      - name: Run plasmidbin validate
        run: cargo run -p plasmidbin -- validate .

      - name: Dry-run fetch (check asset availability)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cargo run -p plasmidbin -- fetch --dry-run --all 2>&1 || echo "(no releases yet — expected for fresh repos)"
