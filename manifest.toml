# Ecosystem Genome Manifest
# =========================
#
# Root-level source of truth for stable primal binaries.
# biomeOS and gen4 consumers (sporeGarden) discover and spawn primals from here.
#
# Three-org architecture:
#   syntheticChemistry/  — Springs (science validation, private repos)
#   ecoPrimals/          — Primals (sovereign infrastructure, public)
#   sporeGarden/         — Products (creative surface, public)
#
# Flow: Primals → validated in Springs → composed by sporeGarden products
#       Springs are NOT primals. They validate primals and produce science.
#       gen4 consumers compose primals from plasmidBin/ via JSON-RPC IPC.
#
# Relationship to other manifests:
#   wateringHole/genomeBin/manifest.toml  — distribution metadata + checksums
#   phase2/biomeOS/plasmidBin/            — biomeOS-local cache (spore creation)
#   plasmidBin/                           — THIS: ecosystem-wide stable genomes
#
# Discovery order (biomeOS primal_spawner / PrimalLauncher):
#   1. $ECOPRIMALS_PLASMID_BIN  (explicit override)
#   2. $BIOMEOS_PLASMID_BIN_DIR (biomeOS-specific)
#   3. ./plasmidBin             (cwd)
#   4. ../plasmidBin            (parent)
#   5. ../../plasmidBin         (grandparent — reaches here from phase2/biomeOS/)
#
# Updated: 2026-04-26
# Version: 5.2.0 (Phase 45c — pure composition cells, ludoSpring V53, BTSP everywhere, graphics node)

[manifest]
version = "5.2.0"
format = "genomeBin"
generated = "2026-04-26T00:00:00Z"
checksum_algorithm = "blake3"
# mirror_url = "https://bins.ecoprimals.dev/latest/"

# genomeBin target matrix (ecoBin Architecture Standard):
#   Tier 1 MUST:   x86_64-unknown-linux-musl, aarch64-unknown-linux-musl, armv7-unknown-linux-musleabihf
#   Tier 2 SHOULD: x86_64-pc-windows-gnu, aarch64-linux-android, x86_64-apple-darwin (check-only), aarch64-apple-darwin (check-only)
#   Tier 3 NICE:   riscv64gc-unknown-linux-musl, wasm32-wasip1 (check-only)
#
# "check-only" = cargo check passes (proves pure Rust), but no linker available for cross-build from Linux.
# Layout: primals/{target-triple}/{binary}
# Backward-compat symlinks: primals/{binary} -> x86_64-unknown-linux-musl/{binary}

