# =============================================================================
# SPRINGS — Science validation domains
# =============================================================================
#
# Springs are NOT primals. They do not ship deployable binaries.
# Springs validate science by composing NUCLEUS primals:
#
#   Research paper → Python baseline → Rust validation → Primal composition
#
# Each spring's domain logic evolves from local Rust code toward orchestrated
# primal capability calls. plasmidBin deploys the PRIMALS that springs
# compose against. The [niches] section below defines what each spring needs.
#
# Evolution status legend:
#   paper     = published research, Python baselines documented
#   rust      = faithful Rust port, validated against Python
#   ipc       = wiring IPC to primals (transitional _primal binaries)
#   composing = domain logic delegates to primal capabilities
#   composed  = fully graph-driven, no spring binary needed
#
# Spring _primal binaries (e.g. healthspring_primal) are transitional IPC
# servers that exist during the "ipc" and "composing" phases. They are NOT
# the end state — the end state is primal composition orchestrated by biomeOS.

