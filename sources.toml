# GitHub Source Registry
# =====================
#
# Maps each primal to its source GitHub repository.
# Used by update.sh for version checks and build-from-source workflows.
#
# PRIMARY DISTRIBUTION: plasmidBin GitHub Releases (ecoPrimals/plasmidBin)
# fetch.sh downloads binaries from plasmidBin releases, NOT per-repo releases.
# This file is used when building from source or checking for upstream updates.
#
# Org layout:
#   ecoPrimals/          — Primals + infra (public, except bearDog + skunkBat)
#   syntheticChemistry/  — Springs (science validation, private)
#   sporeGarden/         — Products (gen4 consumers, public)
#
# primalSpring owns plasmidBin and is responsible for:
#   - Harvesting musl-static ecoBin binaries from primal repos
#   - Cutting plasmidBin releases for downstream consumption
#   - Validating composition readiness before release
#   - Finding gaps to report upstream to primal teams
#
# Updated: 2026-04-11

# =============================================================================
# PRIMALS — Tower Atomic (electron: trust boundary)
# =============================================================================

[sources.beardog]
repo = "ecoPrimals/bearDog"
private = true
tag_pattern = "v{version}"
assets = ["beardog"]
note = "Crypto primitive — private source, public binary via plasmidBin releases"

[sources.songbird]
repo = "ecoPrimals/songBird"
