# sourdough — Scaffolding & packaging meta-primal
# SPDX-License-Identifier: AGPL-3.0-or-later

[primal]
name = "sourdough"
version = "0.3.0"
domain = "scaffolding"
description = "Starter culture — scaffolds new primals, produces genomeBin packages, ecosystem CLI tooling"
license = "AGPL-3.0-or-later"

[provenance]
built_from = "primals/sourDough"
built_at = "2026-03-31T00:00:00Z"

[compatibility]
min_ipc_version = "1.0"
capabilities = [
    "scaffold.primal",
    "scaffold.spring",
    "package.genomeBin",
    "package.ecoBin",
]

# ── ecoBin: per-architecture builds ─────────────────────────────────

[builds.x86_64-linux]
binary = "sourdough"
target = "x86_64-unknown-linux-musl"
pie_verified = true
static_linked = true
# checksum_sha256 = ""  # populated on first harvest

[builds.aarch64-linux]
binary = "sourdough"
target = "aarch64-unknown-linux-musl"
pie_verified = true
static_linked = true
# checksum_sha256 = ""  # populated on first aarch64 harvest

# ── genomeBin: deployment intelligence ──────────────────────────────
# sourDough is a build-time CLI tool, not a runtime server.
# It does not participate in NUCLEUS compositions.

[genomeBin]
tier = "meta"
unibin_modes = ["scaffold", "package", "version", "help"]
default_mode = "help"

[genomeBin.service]
restart_policy = "no"
after = []
wants = []
