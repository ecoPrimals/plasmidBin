# ludoSpring — Game science composition (from ludoSpring)
# SPDX-License-Identifier: AGPL-3.0-or-later
#
# ludoSpring is a Spring, not a primal. Springs produce primals and define
# compositions — they do not deploy as standalone binaries. The game science
# capabilities are served by composing existing primals at runtime via the
# NUCLEUS cell graph.
#
# The ludospring binary exists in the spring source tree as the Rust
# validation target (tier 2 of the 3-tier ladder: Python → Rust → Composition).
# It is NOT a deployable artifact.

[composition]
name = "ludospring"
version = "0.11.0"
domain = "game"
description = "Game science composition: flow analysis, DDA, WFC, Fitts law, engagement metrics, accessibility, noise generation, UI analysis — served by composing primals via NUCLEUS cell graph"
license = "AGPL-3.0-or-later"
cell_graph = "ludospring_cell.toml"
deploy_graph = "ludospring_gaming_niche.toml"
continuous_graph = "game_loop_continuous.toml"

[provenance]
built_from = "springs/ludoSpring"
session_version = "V53"

[compatibility]
min_ipc_version = "1.0"

# Capabilities are served by composed primals, not by a ludospring binary.
# The cell graph routes each capability to its primal provider.
[compatibility.capability_routing]
"activation.fitts" = "barracuda"
"activation.hick" = "barracuda"
"math.sigmoid" = "barracuda"
"math.log2" = "barracuda"
"stats.mean" = "barracuda"
"stats.std_dev" = "barracuda"
"stats.variance" = "barracuda"
"noise.perlin2d" = "barracuda"
"rng.uniform" = "barracuda"
"tensor.create" = "barracuda"
"tensor.matmul" = "barracuda"
"visualization.render.scene" = "petaltongue"
"visualization.render.stream" = "petaltongue"
"visualization.render.dashboard" = "petaltongue"
"visualization.export" = "petaltongue"
"interaction.poll" = "petaltongue"
"interaction.subscribe" = "petaltongue"
"ai.inference" = "squirrel"
"ai.query" = "squirrel"
"compute.dispatch" = "toadstool"
"compute.capabilities" = "toadstool"
"shader.compile" = "coralreef"
"shader.execute" = "coralreef"
"crypto.sign" = "beardog"
"crypto.hash" = "beardog"
"crypto.verify" = "beardog"
"discovery.announce" = "songbird"
"discovery.query" = "songbird"
"storage.store" = "nestgate"
"storage.retrieve" = "nestgate"
"dag.session.create" = "rhizocrypt"
"dag.event.append" = "rhizocrypt"
"certificate.mint" = "loamspine"
"attribution.record" = "sweetgrass"

[composition.primals]
beardog = { role = "security", required = true }
songbird = { role = "discovery", required = true }
barracuda = { role = "tensor", required = false, fallback = "skip" }
coralreef = { role = "shader", required = false, fallback = "skip" }
toadstool = { role = "compute", required = false, fallback = "skip" }
squirrel = { role = "ai", required = false, fallback = "skip" }
petaltongue = { role = "visualization", required = true }
nestgate = { role = "storage", required = false, fallback = "skip" }
rhizocrypt = { role = "dag", required = false, fallback = "skip" }
loamspine = { role = "ledger", required = false, fallback = "skip" }
sweetgrass = { role = "attribution", required = false, fallback = "skip" }

[composition.validation]
spring = "springs/ludoSpring"
validation_binary = "ludospring"
validation_tier = "rust"
test_count = 817
guidestone_binary = "ludospring_guidestone"
guidestone_readiness = 4
