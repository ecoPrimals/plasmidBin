# ludospring — Game science spring primal (from ludoSpring)
# SPDX-License-Identifier: AGPL-3.0-or-later

[primal]
name = "ludospring"
version = "0.8.0"
domain = "game"
description = "Game science: flow analysis, DDA, WFC, Fitts law, engagement metrics, accessibility, noise generation, UI analysis"
license = "AGPL-3.0-or-later"

[provenance]
built_from = "springs/ludoSpring"
built_at = "2026-04-10T23:18:00Z"
checksum_sha256 = "2f2ca987a7b57c10fe679b18f1b293b3d9c667cea3c35afe20897e5821472784"

[compatibility]
min_ipc_version = "1.0"
capabilities = [
    "game.evaluate_flow",
    "game.fitts_cost",
    "game.engagement",
    "game.generate_noise",
    "game.analyze_ui",
    "game.accessibility",
    "game.wfc_step",
    "game.difficulty_adjustment",
    "game.begin_session",
    "game.record_action",
    "game.complete_session",
    "game.poll_telemetry",
    "game.npc_dialogue",
    "game.narrate_action",
    "game.voice_check",
    "game.push_scene",
    "game.query_vertices",
    "game.mint_certificate",
    "game.storage_put",
    "game.storage_get",
    "game.gpu.sigmoid",
    "game.gpu.dot_product",
    "game.gpu.noise",
    "game.gpu.engagement",
    "game.gpu.batch_raycast",
    "health.liveness",
    "health.readiness",
    "capability.list",
    "tools.list",
    "tools.call",
]

[builds.x86_64-linux]
binary = "ludospring"
target = "x86_64-unknown-linux-gnu"
pie_verified = true
static_linked = false

[builds.aarch64-linux]
binary = "ludospring"
target = "aarch64-unknown-linux-musl"
pie_verified = true
static_linked = true

[genomeBin]
tier = "ecoBin"
unibin_modes = ["server", "status", "version"]
default_mode = "server"

[genomeBin.server]
tcp_port_env = "LUDOSPRING_PORT"
tcp_port_default = 9650
health_probe = "health.liveness"

[genomeBin.service]
restart_policy = "on-failure"
after = ["beardog", "songbird"]
wants = ["toadstool", "squirrel"]
