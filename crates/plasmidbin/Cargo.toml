[package]
name = "plasmidbin"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Unified CLI for plasmidBin sovereign binary distribution"

[[bin]]
name = "plasmidbin"
path = "src/main.rs"

[dependencies]
plasmidbin-types = { path = "../plasmidbin-types" }
clap = { workspace = true }
blake3 = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = "1"
toml = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
libc = "0.2"
