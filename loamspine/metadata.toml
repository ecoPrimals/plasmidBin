# SPDX-License-Identifier: AGPL-3.0-or-later

[primal]
name = "loamspine"
version = "0.9.16"
domain = "permanence"
description = "Permanence primal — append-only ledger, spine lifecycle, provenance trio session commits"
license = "AGPL-3.0-or-later"

[provenance]
built_from = "primals/loamSpine"
built_at = "2026-04-12T00:00:00Z"

[compatibility]
min_ipc_version = "1.0"
wire_standard = "L3"
capabilities = [
    "spine.create",
    "spine.get",
    "spine.seal",
    "entry.append",
    "entry.get",
    "entry.get_tip",
    "certificate.mint",
    "certificate.transfer",
    "certificate.loan",
    "certificate.return",
    "certificate.get",
    "certificate.verify",
    "certificate.lifecycle",
    "proof.generate_inclusion",
    "proof.verify_inclusion",
    "session.commit",
    "braid.commit",
    "anchor.publish",
    "anchor.verify",
    "health.check",
    "health.liveness",
    "health.readiness",
]

# ── ecoBin: per-architecture builds ─────────────────────────────────

[builds.x86_64-linux]
binary = "loamspine"
checksum_sha256 = "186174f86dce98731d6614928f235955052edbf241562c513bb868d2c17e888f"
target = "x86_64-unknown-linux-musl"
pie_verified = true
static_linked = true

[builds.aarch64-linux]
binary = "loamspine"
target = "aarch64-unknown-linux-musl"
pie_verified = true
static_linked = true
# checksum_sha256 = ""  # populated on first aarch64 harvest

# ── genomeBin: deployment intelligence ──────────────────────────────

[genomeBin]
tier = "genomeBin"
unibin_modes = ["server", "version", "doctor"]
default_mode = "server"

[genomeBin.server]
tcp_port_env = "LOAMSPINE_PORT"
tcp_port_default = 0
port_flag = "--port"
jsonrpc_port_flag = "--jsonrpc-port"
socket_flag = "--socket"
tcp_opt_in = true
uds_unconditional = true

[genomeBin.sockets]
primary = "permanence.sock"
capability_domain = "ledger.sock"
legacy = "loamspine.sock"

[genomeBin.service]
restart_policy = "always"
after = ["beardog"]
wants = ["nestgate"]
